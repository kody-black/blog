<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">先写草稿，再放心发布</title><desc id="desc">保存到 GitHub ≠ 已经部署成功。01  新建并保存草稿：标题 / 分类 / 图片 / 正文；02  预览检查：确认排版和所有图片；03  关闭草稿并保存：main 分支触发 Actions；04  等待部署完成：构建、部署成功后查看线上</desc>
<rect width="1120" height="640" rx="24" fill="#0f172a"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="64" y="80" fill="#38bdf8" font-size="18" letter-spacing="3">KODY BLOG · PAGES CMS</text>
<text x="64" y="146" fill="#f8fafc" font-size="40" font-weight="700">先写草稿，再放心发布</text>
<text x="64" y="190" fill="#94a3b8" font-size="21">保存到 GitHub ≠ 已经部署成功</text>
<rect x="64" y="236" width="478" height="132" rx="16" fill="#1e293b" stroke="#334155"/><rect x="64" y="256" width="4" height="88" fill="#38bdf8"/><text x="88" y="281" fill="#f1f5f9" font-size="24" font-weight="600">01  新建并保存草稿</text><text x="88" y="326" fill="#cbd5e1" font-size="20">标题 / 分类 / 图片 / 正文</text>
<rect x="578" y="236" width="478" height="132" rx="16" fill="#1e293b" stroke="#334155"/><rect x="578" y="256" width="4" height="88" fill="#a78bfa"/><text x="602" y="281" fill="#f1f5f9" font-size="24" font-weight="600">02  预览检查</text><text x="602" y="326" fill="#cbd5e1" font-size="20">确认排版和所有图片</text>
<rect x="64" y="396" width="478" height="132" rx="16" fill="#1e293b" stroke="#334155"/><rect x="64" y="416" width="4" height="88" fill="#38bdf8"/><text x="88" y="441" fill="#f1f5f9" font-size="24" font-weight="600">03  关闭草稿并保存</text><text x="88" y="486" fill="#cbd5e1" font-size="20">main 分支触发 Actions</text>
<rect x="578" y="396" width="478" height="132" rx="16" fill="#1e293b" stroke="#334155"/><rect x="578" y="416" width="4" height="88" fill="#a78bfa"/><text x="602" y="441" fill="#f1f5f9" font-size="24" font-weight="600">04  等待部署完成</text><text x="602" y="486" fill="#cbd5e1" font-size="20">构建、部署成功后查看线上</text>
