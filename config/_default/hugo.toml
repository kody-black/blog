# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://nunocoracao.github.io/blowfish/docs/getting-started/

theme = "blowfish"
baseURL = "https://kody-black.github.io/blog/"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true

enableRobotsTXT = true
paginate = 20
summaryLength = 30

buildDrafts = false
buildFuture = false

enableEmoji = true
# 让 article.showDateUpdated 真正生效：默认 lastmod 取值链以 :git 优先，
# 不开的话 .Lastmod 恒等于 .Date，"更新于"永远不会显示。
# CI 里 checkout 已经配了 fetch-depth: 0，能拿到完整历史。
enableGitInfo = true

# googleAnalytics = "G-XXXXXXXXX"

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]
